#!name=Lantern Probe v14 Fresh Setup
#!desc=Fresh Shadowrocket setup for Lantern TLS profile diagnostics. All normal traffic stays DIRECT.

[General]
bypass-system = true

[Rule]
DOMAIN,connect.rom.miui.com,DIRECT
DOMAIN,df.iantem.io,DIRECT
FINAL,DIRECT

[Script]
Lantern TLS Profile v14 = type=http-request,pattern=^https:\/\/connect\.rom\.miui\.com\/lantern-(?:check|run|material|tls-profile|versions)(?:\?.*)?$,requires-body=false,timeout=30,engine=jsc,script-path=https://cdn.jsdelivr.net/gh/omzdmr/lantern-shadowrocket1@bb89facfbdc06f48f877d8999560e3aee25e4aa6/lantern_shadowrocket_probe_v14.js,enable=true

[MITM]
hostname = connect.rom.miui.com
enable = true
