# Lantern v18 real-node pool
# Requires real Home Lua nodes imported with these exact titles.

[General]
ipv6 = false
prefer-ipv6 = false
dns-server = https://223.5.5.5/dns-query, https://doh.pub/dns-query
dns-direct-system = true
hijack-dns = 8.8.8.8:53, 8.8.4.4:53, 1.1.1.1:53
block-quic = all-proxy
udp-policy-not-supported-behaviour = REJECT

[Proxy Group]
Lantern-Pool = random,Lantern Auto v18.2 angel.co,Lantern Auto v18.2 dotloop.com,Lantern Auto v18.2 nest.com,url=http://example.com,interval=60,timeout=5

[Rule]
DOMAIN,connect.rom.miui.com,DIRECT
DOMAIN,df.iantem.io,DIRECT
FINAL,Lantern-Pool
